"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# Rust toolchain (with the wasm target and wasm-bindgen) plus npm deps.
setup = """
set -e
if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
fi
. "$HOME/.cargo/env"
rustup target add wasm32-unknown-unknown
command -v wasm-bindgen >/dev/null || cargo install wasm-bindgen-cli --version 0.2.130 --locked
npm install
"""
run_mode = "concurrent"

[scripts.run.game]
available_in = [ "local" ]
command = ". \"$HOME/.cargo/env\" && npm run wasm && npx vite --port $CONDUCTOR_PORT --strictPort --open"
default = true
icon = "gamepad-2"

[scripts.run.test]
command = ". \"$HOME/.cargo/env\" && cargo test --release"
icon = "test-tube"
