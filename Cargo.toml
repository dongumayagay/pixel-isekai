[workspace]
resolver = "3"
members = ["sim"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2

# Fast iteration build for the watch loop: optimised enough to run the sim
# smoothly, but incremental and without fat LTO.
[profile.wasm-dev]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true

# Fast native iteration (PNG examples, tests): seconds instead of fat-LTO minutes.
# Use `--release` only for final bench / art_hash.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
