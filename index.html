<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1925">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pixel Isekai — A Second Life</title>
<style>
:root{color-scheme:dark;--cream:#f1eddb}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{background:#204a3f;color:var(--cream);font:700 12px/1.25 ui-monospace,"Courier New",monospace;touch-action:none}
.game-shell,.viewport{position:fixed;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden}
.viewport{z-index:0;background:#162327;display:flex;align-items:center;justify-content:center}
canvas{display:block;width:auto;height:auto;max-width:100vw;max-height:100dvh;aspect-ratio:9/16;background:#2f6657;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.topbar{position:fixed;z-index:3;inset:0 0 auto;height:auto;padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));pointer-events:none;display:flex;align-items:flex-start;gap:8px}
.readouts{display:flex;align-items:center;gap:12px;font-size:12px;line-height:24px;white-space:nowrap;background:rgba(12,30,35,.64);border:1px solid rgba(189,220,199,.26);padding:3px 11px;border-radius:18px;text-shadow:1px 2px 0 #122c30}
#hp{color:#ffb6bd}#sigils{color:#c0fff0}
button{appearance:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer;font:800 12px/1.2 ui-monospace,"Courier New",monospace;color:#f8edcf;background:#244b4c;border:1px solid #7aa79b}
button:focus-visible{outline:2px solid #ffe7ac;outline-offset:3px}
#menuToggle{margin-left:auto;pointer-events:auto;flex:0 0 42px;width:42px;height:42px;border-radius:22px;background:rgba(14,33,41,.54);border-color:rgba(196,220,210,.35);font-size:24px;line-height:1;display:grid;place-items:center}
.touch{position:fixed;inset:0;z-index:3;pointer-events:none}
#context{pointer-events:auto;position:absolute;right:calc(19px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:66px;height:66px;border:2px solid rgba(221,248,228,.54);border-radius:50%;background:rgba(17,51,55,.50);box-shadow:0 3px 12px #092d3559;backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;opacity:.85}
#context:active{transform:scale(.95);background:rgba(123,191,168,.63)}
#context .symbol{color:#e3ffe7;font-size:28px;line-height:1;pointer-events:none}
#contextLabel{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#introHint{position:fixed;left:calc(11px + env(safe-area-inset-left));bottom:calc(19px + env(safe-area-inset-bottom));z-index:2;max-width:155px;width:max-content;line-height:1.4;text-align:left;font-size:10px;letter-spacing:.02em;color:#e3efe3;background:#112d36a3;padding:5px 8px;border-radius:10px;pointer-events:none;transition:opacity .35s}
#introHint.gone{opacity:0}
#menuPanel[hidden]{display:none!important}
#menuPanel{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:#0a1926c9;padding:12px;backdrop-filter:blur(2px)}
.menu-card{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;width:min(310px,100%);max-height:calc(100dvh - 24px);overflow-y:auto;padding:14px;background:#142f37;border:2px solid #739c8c;box-shadow:0 7px 0 #071722;border-radius:8px}
.menu-heading{grid-column:1/-1;font-size:14px;letter-spacing:.13em;color:#eedca7;text-align:center;padding:1px 0 3px}
.menu-status{grid-column:1/-1;display:flex;justify-content:center;gap:14px;color:#c4dccc;font-size:11px;padding-bottom:3px}
.menu-card button{min-height:40px;padding:8px;border-radius:5px;background:#2a5053;border:1px solid #7fa897}
.menu-card button:active{background:#447868}
.menu-card #resume{grid-column:1/-1;background:#a8deb1;color:#15363a;border-color:#d7efc0}
#potion{color:#c9f2d1}
/* During the prologue there are no onscreen widgets: the entire view is the story. */
body.cinematic .topbar,body.cinematic .touch,body.cinematic #introHint{display:none!important}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;clip-path:inset(50%)}
@media(orientation:landscape){#context{right:calc(21px + env(safe-area-inset-right));bottom:calc(15px + env(safe-area-inset-bottom));width:58px;height:58px}#introHint{bottom:calc(11px + env(safe-area-inset-bottom))}}
@media(max-height:390px){.menu-card{padding:9px;gap:4px}.menu-card button{min-height:34px;padding:5px}.menu-heading{font-size:12px}}
@media(prefers-reduced-motion:reduce){#introHint{transition:none}}
</style>
</head>
<body>
<main class="game-shell" aria-label="Pixel Isekai RPG">
  <div class="viewport">
    <canvas id="game" width="224" height="485" tabindex="0" role="img" aria-label="A top-down pixel-art isekai adventure. Tap to advance the prologue, or tap Skip in the top right."></canvas>
  </div>
  <header class="topbar">
    <div class="readouts" aria-label="Hero status"><span id="hp" aria-label="Health">♥ 6/6</span><span id="sigils" aria-label="Moon sigils">✦ 0/3</span></div>
    <button id="menuToggle" aria-label="Open menu" aria-expanded="false">⋮</button>
  </header>
  <div class="touch" aria-label="Touch controls">
    <button id="context" aria-label="Attack"><span class="symbol" id="contextIcon" aria-hidden="true">✦</span><span id="contextLabel">ATTACK</span></button>
  </div>
  <div id="introHint" aria-hidden="true">Tap the world to walk · Tap ✦ to act</div>
  <div id="menuPanel" hidden aria-label="Game menu" role="dialog">
    <div class="menu-card">
      <div class="menu-heading">A SECOND LIFE</div>
      <div class="menu-status"><span id="level">LV 1</span><span>PAUSED</span></div>
      <button id="quest">QUEST</button><button id="bag">BAG</button>
      <button id="potion" aria-label="Heal using a potion">HEAL +4 (×<span id="potionCount">2</span>)</button><button id="save">SAVE</button>
      <button id="load">LOAD</button><button id="sound">SOUND: ON</button>
      <button id="new">RESTART</button><button id="resume">CONTINUE</button>
    </div>
  </div>
  <div id="status" class="sr-only" role="status" aria-live="polite">Find shelter before nightfall.</div>
</main>

function road(tx,ty){return (tx>=9&&tx<=54&&ty>=18&&ty<=21)||(tx>=29&&tx<=31&&ty>=8&&ty<=21)||(tx>=42&&tx<=44&&ty>=18&&ty<=31)||(tx>=16&&tx<=18&&ty>=18&&ty<=33)||(tx>=3&&tx<20&&ty>=18&&ty<=23)||(tx>=6&&tx<=8&&ty>=20&&ty<=36)}

function reserved(tx,ty){if(road(tx,ty)||building(tx,ty)||water(tx,ty))return true;if(tx>=49&&tx<=54&&ty>=15&&ty<=23)return true;if(tx<19&&ty>=12&&ty<=24)return true;return stones.some(p=>Math.abs(p.tx-tx)<3&&Math.abs(p.ty-ty)<3)}

function solidAt(x,y){if(x<16||y<16||x>WX-16||y>WY-16)return true;let tx=Math.floor(x/T),ty=Math.floor(y/T);if(water(tx,ty)||building(tx,ty))return true;

 return false}

// Keep the hitbox clear all along a straight walking segment, not just at its ends.
function clearSegment(ax,ay,bx,by){
 const d=dist(ax,ay,bx,by),steps=Math.max(1,Math.ceil(d/3));
 for(let i=1;i<=steps;i++){const t=i/steps;if(blocked(ax+(bx-ax)*t,ay+(by-ay)*t,5))return false}
 return true;
}
function passableCell(cx,cy){return cx>=0&&cy>=0&&cx<NAV_COLS&&cy<NAV_ROWS&&!blocked((cx+.5)*NAV_STEP,(cy+.5)*NAV_STEP,5)}
// Small-grid A* routes around trees, ponds and houses. Only runs when the user taps.
function routeTo(sx,sy,tx,ty){
 tx=clamp(tx,20,WX-20);ty=clamp(ty,20,WY-20);
 if(!blocked(tx,ty,5)&&clearSegment(sx,sy,tx,ty))return [{x:tx,y:ty}];
 const cx=Math.floor(sx/NAV_STEP),cy=Math.floor(sy/NAV_STEP);
 let start=null,startDistance=Infinity;
 for(let y=cy-2;y<=cy+2;y++)for(let x=cx-2;x<=cx+2;x++){
  if(!passableCell(x,y))continue;const d=(x+.5-sx/NAV_STEP)**2+(y+.5-sy/NAV_STEP)**2;
  if(d<startDistance){startDistance=d;start=[x,y]}
 }
 if(!start)return [];
 const gx=Math.floor(tx/NAV_STEP),gy=Math.floor(ty/NAV_STEP);
 let goal=null,goalDist=Infinity;
 for(let y=gy-8;y<=gy+8;y++)for(let x=gx-8;x<=gx+8;x++){
  if(!passableCell(x,y))continue;const d=((x+.5)*NAV_STEP-tx)**2+((y+.5)*NAV_STEP-ty)**2;
  if(d<goalDist){goalDist=d;goal=[x,y]}
 }
 if(!goal)return [];
 const total=NAV_COLS*NAV_ROWS,score=new Float32Array(total),parent=new Int32Array(total),closed=new Uint8Array(total);
 score.fill(Infinity);parent.fill(-1);
 const sid=start[1]*NAV_COLS+start[0],gid=goal[1]*NAV_COLS+goal[0];score[sid]=0;
 const heap=[];
 function push(id,f){let i=heap.length;heap.push([id,f]);while(i>0){let p=(i-1)>>1;if(heap[p][1]<=f)break;heap[i]=heap[p];i=p}heap[i]=[id,f]}
 function pop(){const best=heap[0],last=heap.pop();if(heap.length){let i=0;while(true){let c=i*2+1;if(c>=heap.length)break;if(c+1<heap.length&&heap[c+1][1]<heap[c][1])c++;if(heap[c][1]>=last[1])break;heap[i]=heap[c];i=c}heap[i]=last}return best[0]}
 const h=(x,y)=>Math.hypot(x-goal[0],y-goal[1]);
 push(sid,h(start[0],start[1]));
 let found=false,nearest=sid,nearDist=Infinity,checks=0;
 while(heap.length&&checks++<total){
  const id=pop();if(closed[id])continue;closed[id]=1;
  const x=id%NAV_COLS,y=(id/NAV_COLS)|0;
  const d=h(x,y);if(d<nearDist){nearest=id;nearDist=d}
  if(id===gid){found=true;nearest=id;break}
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
   if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;
   if(!passableCell(nx,ny))continue;
   if(dx&&dy&&(!passableCell(nx,y)||!passableCell(x,ny)))continue;
   const ni=ny*NAV_COLS+nx;if(closed[ni])continue;
   const ng=score[id]+(dx&&dy?1.41421356237:1);
   if(ng<score[ni]){score[ni]=ng;parent[ni]=id;push(ni,ng+h(nx,ny))}
  }
 }
 if(!found&&nearest===sid)return [];
 const steps=[];let at=nearest;
 while(at!==sid&&at!==-1){const x=at%NAV_COLS,y=(at/NAV_COLS)|0;steps.push({x:(x+.5)*NAV_STEP,y:(y+.5)*NAV_STEP});at=parent[at]}
 steps.reverse();
 if(found&&!blocked(tx,ty,5)&&clearSegment(steps.length?steps[steps.length-1].x:sx,steps.length?steps[steps.length-1].y:sy,tx,ty))steps.push({x:tx,y:ty});
 // Skip redundant tile waypoints to move naturally along clear lines.
 const out=[];let pos=0,anchor={x:sx,y:sy};
 while(pos<steps.length){let end=pos;
  for(let j=pos;j<Math.min(steps.length,pos+22);j++){
   if(clearSegment(anchor.x,anchor.y,steps[j].x,steps[j].y))end=j;
  }
  out.push(steps[end]);anchor=steps[end];pos=end+1;
 }
 return out;
}
function tappedActor(x,y){
 const points=[{x:shelter.tx*T,y:shelter.ty*T,tap:59,reach:30}];
 if(state.sheltered)for(const n of npc)points.push({x:n.tx*T,y:n.ty*T,tap:27,reach:27});
 points.push({x:gate.tx*T,y:gate.ty*T,tap:39,reach:34});
 return points.filter(o=>dist(x,y,o.x,o.y)<o.tap).sort((a,b)=>dist(x,y,a.x,a.y)-dist(x,y,b.x,b.y))[0]||null;
}
function tapWorld(clientX,clientY){
 const box=canvas.getBoundingClientRect();
 const x=clamp((clientX-box.left)*W/box.width+cam.x,16,WX-16),y=clamp((clientY-box.top)*H/box.height+cam.y,16,WY-16);
 const target=tappedActor(x,y),end=target||{x,y};
 if(target&&dist(state.hero.x,state.hero.y,target.x,target.y)<target.reach){stopWalk();act();return}
 const points=routeTo(state.hero.x,state.hero.y,end.x,end.y);
 stopWalk();
 if(points.length){nav.waypoints=points;nav.action=target;nav.marker={x,y,life:.9}}
}

const tileCache=new Map();
function terrainTile(kind,variant){
 const key=kind+'-'+variant;if(tileCache.has(key))return tileCache.get(key);
 const c=document.createElement('canvas');c.width=T;c.height=T;const g=c.getContext('2d',{alpha:false});
 const dot=(x,y,w,h,color)=>{g.fillStyle=color;g.fillRect(x,y,w,h)};
 const rand=(i,j)=>rnd(variant*107+i*73+kind.length,variant*41+j*131);
 const base=kind==='grass'?['#294b3f','#305545','#355b47','#3a5f4b','#2c5147','#385e4b'][variant%6]:
 kind==='path'?['#695341','#775c47','#82654d','#8d6e54','#785f4c'][variant%5]:
 ['#1a4c5a','#20596a','#286474','#24616f'][variant%4];
 dot(0,0,16,16,base);
 if(kind==='grass'){
  const lows=['#24473e','#29483f','#31513e','#2f5945','#40694b'];
  const highs=['#4c7856','#57855e','#689668','#7e9b65','#376b53'];
  for(let i=0;i<23;i++){
   const x=Math.floor(rand(i,1)*16),y=Math.floor(rand(i,2)*16);
   dot(x,y,1+(rand(i,3)>.79?2:0),1,lows[i%lows.length]);
  }
  for(let i=0;i<11;i++){
   const x=Math.floor(rand(i,4)*15),y=Math.floor(rand(i,5)*15);
   dot(x,y,1,2,highs[i%highs.length]);
   if(i%3===0){dot(x+1,y-1,2,1,'#537c59');dot(x-1,y-2,1,1,'#3e7857')}
  }
  if(variant%7===2||variant%7===4){
   const x=3+Math.floor(rand(21,22)*9),y=4+Math.floor(rand(22,23)*7);
   dot(x-1,y,1,1,'#e4a2aa');dot(x+1,y,1,1,'#f1bea5');dot(x,y-1,1,1,'#f7ead1');dot(x,y+1,1,1,'#7d9f60');
  }
  if(variant%9===0){let x=4+Math.floor(rand(5,10)*7),y=5+Math.floor(rand(12,1)*6);dot(x-2,y+1,5,1,'#264b3c');dot(x-2,y,2,2,'#507957');dot(x+1,y-2,2,3,'#689360')}
  if(variant%11===3){let x=5+Math.floor(rand(13,6)*6),y=4+Math.floor(rand(16,3)*7);dot(x,y,2,3,'#d8c298');dot(x-1,y,4,1,'#b98064');dot(x,y-1,2,1,'#e8b97b')}
 }else if(kind==='path'){
  for(let i=0;i<20;i++){
   let x=Math.floor(rand(i,0)*15),y=Math.floor(rand(i,7)*15),s=rand(i,9);
   dot(x,y,s>.85?3:s>.6?2:1,s>.9?2:1,i%5===0?'#ae8e66':i%5===1?'#4d493b':i%5===2?'#9a7957':i%5===3?'#695447':'#b39a75');
  }
  for(let i=0;i<3;i++){let x=Math.floor(rand(i,22)*13),y=Math.floor(rand(i,33)*12);dot(x,y,4,1,'#5a503f');dot(x+1,y+1,1,1,'#ac8e68')}
  if(variant%3===0){dot(1,9,1,3,'#6a8a57');dot(2,8,1,2,'#86a169');dot(12,12,2,1,'#527451')}
 }else{
  for(let i=0;i<23;i++){let x=Math.floor(rand(i,1)*16),y=Math.floor(rand(i,2)*16);dot(x,y,i%5?2:4,1,i%3===0?'#357886':i%3===1?'#1c5363':'#3a8190')}
  for(let i=0;i<4;i++){let x=Math.floor(rand(i,17)*10),y=2+i*3;dot(x,y,5,1,i%2?'#77b8b6':'#4c9da4');dot(x+2,y-1,2,1,'#5d9eaa')}
 }
 tileCache.set(key,c);return c;
}
function drawTile(tx,ty){
 const sx=tx*T-cam.x,sy=ty*T-cam.y;
 if(tx<0||ty<0||tx>=MW||ty>=MH){px(sx,sy,T,T,'#172d38');return}
 const path=road(tx,ty),wet=water(tx,ty);
 const variant=Math.floor(rnd(tx*3+5,ty*7+19)*36);
 const kind=wet?'water':path?'path':'grass';
 ctx.drawImage(terrainTile(kind,variant),Math.round(sx),Math.round(sy));
 // Organic broken transitions disguise the original collision grid.
 if(path){
  if(!road(tx-1,ty)){px(sx,sy,1,16,'#375a44');for(let i=0;i<4;i++)px(sx+1,sy+i*4+2,2+(variant+i)%3,2,'#4c6c4d')}

 }
 if(wet){

 for(let i=0;i<24;i++){let x=rnd(i*3,49)*W,y=rnd(i*7,52)*sh;
   if(x>roadL&&x<roadR)px(x,y,8,2,i%2?'#587a8c':'#b6b4a56b');else px(x,y,3+i%8,2,'#8dabc160')}
 const step=truck?Math.min(1,state.introAge/2.7):0;
 const x=roadL+(truck?14+step*Math.min(42,(roadR-roadL)*.5):9);
 introPerson('hero',x,crossY+13,2);
 if(truck){
  const cx=(roadL+roadR)*.53, truckY=-7+Math.min(1,step)*(crossY+6);
  px(cx-25,truckY-9,50,76,'#0d1724');px(cx-21,truckY-6,42,71,'#354f60');
  px(cx-19,truckY-4,38,63,'#6f8894');px(cx-16,truckY+3,32,16,'#c8ddd8');
  px(cx-14,truckY+6,28,10,'#416679');px(cx-15,truckY+23,30,29,'#e3ddca');
  for(let i=0;i<8;i++)px(cx-15+i*4,truckY+24,2,27,i%2?'#adb5ad':'#b9c3b8');
  px(cx-23,truckY+5,5,16,'#151b2a');px(cx+18,truckY+5,5,16,'#151b2a');
  px(cx-18,truckY+55,12,5,'#fff0b2');px(cx+6,truckY+55,12,5,'#fff0b2');
  drawLight(cx,truckY+64,60,255,217,142,.29);
  if(step>.94)px(0,0,W,sh,`rgba(249,246,224,${Math.min(.85,(step-.94)*11)})`);
 }
 introRain(sh,73);
 const dark=ctx.createLinearGradient(0,0,0,sh);dark.addColorStop(0,'rgba(8,17,36,.31)');dark.addColorStop(.5,'rgba(7,13,24,.02)');dark.addColorStop(1,'rgba(14,23,43,.29)');ctx.fillStyle=dark;ctx.fillRect(0,0,W,sh);
}
function introGoddess(sh){
 px(0,0,W,sh,'#142538');
 for(let i=0;i<95;i++){let x=rnd(i*11,2)*W,y=rnd(i*7,30)*sh;px(x,y,i%9===0?3:1,i%8===0?3:1,i%4?'#48647a':'#a2bfbe')}
 const cx=W/2,cy=sh*.49,R=Math.min(W*.43,sh*.47,129);
 // Vast concentric marble dais. Tiny floral mosaics and gilded grout.
 for(let yy=-R;yy<=R;yy+=2){let d=Math.sqrt(Math.max(0,R*R-yy*yy));px(cx-d,cy+yy,d*2,2,yy%7?'#cbd6d2':'#bbcfc9')}
 for(let yy=-R+5;yy<R-5;yy+=2){let rr=R-7,d=Math.sqrt(Math.max(0,rr*rr-yy*yy));px(cx-d,cy+yy,d*2,2,yy%6?'#e1dfd3':'#d8dfd2')}
 for(let i=0;i<90;i++){let a=i*2.399,Ri=(.15+Math.sqrt(rnd(i,77))*.7)*(R-10);let xx=cx+Math.cos(a)*Ri,yy=cy+Math.sin(a)*Ri;px(xx,yy,i%3?2:3,1,i%3?'#aec4bc':'#f5e7ce')}
 for(let rr=R-11;rr>17;rr-=29)for(let i=0;i<48;i++){
  const a=i*Math.PI/24;let xx=cx+Math.cos(a)*rr,yy=cy+Math.sin(a)*rr;
  px(xx,yy,i%3?2:4,2,rr%2?'#b8a789':'#d4b781')
 }
 for(let i=0;i<16;i++){let a=i*Math.PI/8,xx=cx+Math.cos(a)*(R-19),yy=cy+Math.sin(a)*(R-19);
  px(xx-2,yy-2,5,5,'#bca376');px(xx,yy-1,2,3,'#fdf1c8')
 }
 // Colored stained-glass style light passes over the dais.
 ctx.save();ctx.globalCompositeOperation='screen';drawLight(cx,cy-R*.6,R*1.15,255,229,177,.22);drawLight(cx+R*.60,cy,R*.76,142,199,223,.25);ctx.restore();
 for(let i=0;i<28;i++){let xx=rnd(i,35)*W,yy=rnd(i*9,8)*sh,alpha=.27+Math.sin(state.t*1.6+i)*.15;px(xx,yy,2,3,`rgba(255,243,207,${alpha})`)}
 const compact=sh<220,scale=compact?1.6:2;
 const heroFeet=cy+(compact?Math.min(22,sh*.14):Math.min(29,sh*.18));
 const goddessFeet=cy-(compact?6:Math.min(28,sh*.16));
 introPerson('hero',cx-Math.min(40,W*.18),heroFeet,scale);
 introPerson('goddess',cx+Math.min(38,W*.17),goddessFeet,scale);
 const gx=cx+Math.min(38,W*.17),gy=goddessFeet-scale*24-5;
 for(let i=0;i<7;i++){const a=i*Math.PI*2/7+state.t*.15;px(gx+Math.cos(a)*23,gy+Math.sin(a)*10,3,2,i%2?'#f6dea8':'#fdf1c1')}
 const v=ctx.createRadialGradient(cx,cy,R*.25,cx,cy,Math.max(W,sh)*.64);v.addColorStop(0,'rgba(12,23,42,0)');v.addColorStop(1,'rgba(6,15,32,.67)');ctx.fillStyle=v;ctx.fillRect(0,0,W,sh);
}
function introForest(sh){
 drawGame();
 // Slightly muted colors give way to the playable world.
 px(0,0,W,sh,'#0d29404a');
 for(let i=0;i<32;i++){let x=rnd(i,41)*W,y=rnd(i*5,33)*sh;px(x,y,2,2,i%3===0?'#c8f4c67a':'#a6d9c27a')}
}
function introSceneTitle(sh){
 drawGame();px(0,0,W,H,'#071626a0');
 for(let i=0;i<22;i++){let x=rnd(i,51)*W,y=rnd(i*3,22)*sh;px(x,y,2,2,'#e0f3e399')}
 let center=Math.max(50,sh*.50),ts=W>300?25:18;
 btxt('PIXEL ISEKAI',W/2,center,ts,'#122838','center');
 btxt('PIXEL ISEKAI',W/2,center-2,ts,'#f3e8ce','center');
 btxt('A SECOND LIFE',W/2,center+25,W>300?12:10,'#afdac7','center');
}
function introBlack(sh){
 px(0,0,W,H,'#090e1b');
 if(state.introAge<.6)px(0,0,W,H,`rgba(255,250,231,${.9*(1-state.introAge/.6)})`);
}
function introTextWrap(text,x,y,maxWidth,lineH=13,size=10,color='#f4eddf'){
 ctx.font=`bold ${size}px monospace`;
 let line='',lines=[];
 for(const word of text.split(' ')){let attempt=line?line+' '+word:word;
  if(line&&ctx.measureText(attempt).width>maxWidth){lines.push(line);line=word}else line=attempt;
 }
 if(line)lines.push(line);
 for(const ln of lines){btxt(ln,x,y,size,color);y+=lineH}
 return y;
}
function drawIntro(){
 const page=introChapters[state.introPage],land=W>H;
 const ph=land?106:Math.min(155,Math.round(H*.31));const sh=H-ph;
 switch(page.stage){
  case'title':introSceneTitle(sh);break;
  case'office':introOffice(sh,Boolean(page.phone));break;
  case'city':introRoad(sh,false);break;
  case'truck':introRoad(sh,true);break;
  case'dark':introBlack(sh);break;
  case'goddess':introGoddess(sh);break;
  default:introForest(sh);
 }
 // Small caption panel, no permanent HUD or separate cutscene interface.
 px(0,sh-5,W,5,'#1b3449');px(0,sh,W,ph,'#0b1d2bed');px(0,sh,W,2,'#83b7af');
 if(page.tag)btxt(page.tag,12,sh+15,9,'#b8e8d3');
 let y=sh+(page.tag?29:25),sz=10,lH=land?14:13;
 for(const line of page.lines){
  const named=Boolean(line.speaker),x=named?land?94:69:13;
  if(named)btxt(line.speaker,12,y,land?10:9,line.speaker==='GODDESS'?'#f6d794':line.speaker==='YOU'?'#a8f2e0':'#9cceeb');
  y=introTextWrap(line.text,x,y,W-x-13,lH,sz,named?'#f3ead8':'#d7e6dd')+4;
 }
 if(page.stage==='title'&&page.lines.length===1){/* Title art above carries the opening. */}
 btxt(state.introPage===introChapters.length-1?'TAP TO EXPLORE':state.introPage===0?'TAP TO BEGIN':'TAP TO CONTINUE',W/2,H-7,8,'#d9b878','center');
 btxt('SKIP >>',W-11,29,9,'#f4e5bb','right');
 if(state.introAge<.22&&page.stage!=='dark')px(0,0,W,sh,`rgba(10,23,36,${(.22-state.introAge)/.22*.3})`);
}

function frame(now){let dt=Math.min(.045,Math.max(0,(now-last)/1000));last=now;update(dt);refreshAction();if(state.scene==='intro')drawIntro();else drawGame();requestAnimationFrame(frame)}
// Small, read-only-oriented QA access; game logic is otherwise entirely self-contained.
window.__rpg={state,introChapters,art,advanceIntro,debugWarp(tx,ty){state.hero.x=(tx+.5)*T;state.hero.y=(ty+.5)*T},debugSpawnEnemy(){const h=state.hero;state.enemies.push({x:h.x+22,y:h.y,hx:h.x+22,hy:h.y,kind:'slime',hp:2,maxHp:2,speed:0,ang:0,phase:0,hurt:0,dead:0})}};
hud();let resumed=false;try{if(localStorage.getItem('pixel_isekai_v2'))resumed=loadGame()}catch(_){}if(!resumed)startIntro();else document.body.classList.remove('cinematic');state.toast='';state.toastTimer=0;requestAnimationFrame(frame);
})();
