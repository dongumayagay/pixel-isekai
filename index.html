<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1925">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pixel Isekai — A Second Life</title>
<style>
:root{color-scheme:dark;--cream:#f1eddb}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{background:#204a3f;color:var(--cream);font:700 12px/1.25 ui-monospace,"Courier New",monospace;touch-action:none}
.game-shell,.viewport{position:fixed;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden}
.viewport{z-index:0;background:#275f50}
canvas{display:block;width:100%;height:100%;background:#2f6657;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.topbar{position:fixed;z-index:3;inset:0 0 auto;height:auto;padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));pointer-events:none;display:flex;align-items:flex-start;gap:8px}
.readouts{display:flex;align-items:center;gap:12px;font-size:12px;line-height:24px;white-space:nowrap;background:rgba(12,30,35,.64);border:1px solid rgba(189,220,199,.26);padding:3px 11px;border-radius:18px;text-shadow:1px 2px 0 #122c30}
#hp{color:#ffb6bd}#sigils{color:#c0fff0}
button{appearance:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer;font:800 12px/1.2 ui-monospace,"Courier New",monospace;color:#f8edcf;background:#244b4c;border:1px solid #7aa79b}
button:focus-visible{outline:2px solid #ffe7ac;outline-offset:3px}
#menuToggle{margin-left:auto;pointer-events:auto;flex:0 0 42px;width:42px;height:42px;border-radius:22px;background:rgba(14,33,41,.54);border-color:rgba(196,220,210,.35);font-size:24px;line-height:1;display:grid;place-items:center}
.touch{position:fixed;inset:0;z-index:3;pointer-events:none}
#context{pointer-events:auto;position:absolute;right:calc(19px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:66px;height:66px;border:2px solid rgba(221,248,228,.54);border-radius:50%;background:rgba(17,51,55,.50);box-shadow:0 3px 12px #092d3559;backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;opacity:.85}
#context:active{transform:scale(.95);background:rgba(123,191,168,.63)}
#context .symbol{color:#e3ffe7;font-size:28px;line-height:1;pointer-events:none}
#contextLabel{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.joystick{display:none;pointer-events:none;position:fixed;z-index:4;width:92px;height:92px;border:2px solid rgba(235,255,226,.36);border-radius:50%;background:rgba(30,58,65,.22);box-shadow:inset 0 0 0 1px #183a4266;transform:translate(-50%,-50%)}
.joystick.active{display:block}
.stick{position:absolute;width:35px;height:35px;top:50%;left:50%;margin-left:-17.5px;margin-top:-17.5px;border-radius:50%;border:2px solid #d4edd4aa;background:#8ad1af67;box-shadow:0 0 10px #0b222840}
#introHint{position:fixed;left:calc(11px + env(safe-area-inset-left));bottom:calc(19px + env(safe-area-inset-bottom));z-index:2;max-width:155px;width:max-content;line-height:1.4;text-align:left;font-size:10px;letter-spacing:.02em;color:#e3efe3;background:#112d36a3;padding:5px 8px;border-radius:10px;pointer-events:none;transition:opacity .35s}
#introHint.gone{opacity:0}
#menuPanel[hidden]{display:none!important}
#menuPanel{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:#0a1926c9;padding:12px;backdrop-filter:blur(2px)}
.menu-card{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;width:min(310px,100%);max-height:calc(100dvh - 24px);overflow-y:auto;padding:14px;background:#142f37;border:2px solid #739c8c;box-shadow:0 7px 0 #071722;border-radius:8px}
.menu-heading{grid-column:1/-1;font-size:14px;letter-spacing:.13em;color:#eedca7;text-align:center;padding:1px 0 3px}
.menu-status{grid-column:1/-1;display:flex;justify-content:center;gap:14px;color:#c4dccc;font-size:11px;padding-bottom:3px}
.menu-card button{min-height:40px;padding:8px;border-radius:5px;background:#2a5053;border:1px solid #7fa897}
.menu-card button:active{background:#447868}
.menu-card #resume{grid-column:1/-1;background:#a8deb1;color:#15363a;border-color:#d7efc0}
#potion{color:#c9f2d1}
/* During the prologue there are no onscreen widgets: the entire view is the story. */
body.cinematic .topbar,body.cinematic .touch,body.cinematic .joystick,body.cinematic #introHint{display:none!important}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;clip-path:inset(50%)}
@media(orientation:landscape){#context{right:calc(21px + env(safe-area-inset-right));bottom:calc(15px + env(safe-area-inset-bottom));width:58px;height:58px}#introHint{bottom:calc(11px + env(safe-area-inset-bottom))}}
@media(max-height:390px){.menu-card{padding:9px;gap:4px}.menu-card button{min-height:34px;padding:5px}.menu-heading{font-size:12px}}
@media(prefers-reduced-motion:reduce){#introHint{transition:none}}
</style>
</head>

<main class="game-shell" aria-label="Pixel Isekai RPG">
  <div class="viewport">
    <canvas id="game" width="224" height="485" tabindex="0" role="img" aria-label="A top-down pixel-art isekai adventure. Tap to advance the prologue, or tap Skip in the top right."></canvas>
  </div>
  <header class="topbar">
    <div class="readouts" aria-label="Hero status"><span id="hp" aria-label="Health">♥ 6/6</span><span id="sigils" aria-label="Moon sigils">✦ 0/3</span></div>
    <button id="menuToggle" aria-label="Open menu" aria-expanded="false">⋮</button>
  </header>
  <div class="touch" aria-label="Touch controls">
    <button id="context" aria-label="Attack"><span class="symbol" id="contextIcon" aria-hidden="true">✦</span><span id="contextLabel">ATTACK</span></button>
  </div>
  <div class="joystick" id="joystick" aria-hidden="true"><div class="stick" id="stick"></div></div>
  <div id="introHint" aria-hidden="true">Drag left to move · Tap ✦ to act</div>
  <div id="menuPanel" hidden aria-label="Game menu" role="dialog">
    <div class="menu-card">
      <div class="menu-heading">A SECOND LIFE</div>
      <div class="menu-status"><span id="level">LV 1</span><span>PAUSED</span></div>
      <button id="quest">QUEST</button><button id="bag">BAG</button>
      <button id="potion" aria-label="Heal using a potion">HEAL +4 (×<span id="potionCount">2</span>)</button><button id="save">SAVE</button>
      <button id="load">LOAD</button><button id="sound">SOUND: ON</button>
      <button id="new">RESTART</button><button id="resume">CONTINUE</button>
    </div>
  </div>
  <div id="status" class="sr-only" role="status" aria-live="polite">Find shelter before nightfall.</div>
</main>

function sprite(name,x,y,flip=false,palette=shade){const lines=sprites[name];if(!lines)return;for(let j=0;j<lines.length;j++){let row=lines[j];for(let i=0;i<row.length;i++){let ch=row[i],c=palette[ch];if(c)px(x+(flip?row.length-1-i:i),y+j,1,1,c)}}}

function road(tx,ty){return (tx>=9&&tx<=54&&ty>=18&&ty<=21)||(tx>=29&&tx<=31&&ty>=8&&ty<=21)||(tx>=42&&tx<=44&&ty>=18&&ty<=31)||(tx>=16&&tx<=18&&ty>=18&&ty<=33)||(tx>=3&&tx<20&&ty>=18&&ty<=23)||(tx>=6&&tx<=8&&ty>=20&&ty<=36)}
function water(tx,ty){return tx>=35&&tx<=39&&ty>=25&&ty<=28&&((tx!==35&&tx!==39)||(ty===26||ty===27))}

function reserved(tx,ty){if(road(tx,ty)||building(tx,ty)||water(tx,ty))return true;if(tx>=49&&tx<=54&&ty>=15&&ty<=23)return true;if(tx<19&&ty>=12&&ty<=24)return true;return stones.some(p=>Math.abs(p.tx-tx)<3&&Math.abs(p.ty-ty)<3)}
for(let y=3;y<MH-3;y+=2)for(let x=2;x<MW-2;x+=2){if(reserved(x,y))continue;let n=rnd(x*13,y*7);if(n>.76)trees.push({tx:x,ty:y,x:(x+.5)*T,y:(y+.5)*T});else if(n<.07)rocks.push({tx:x,ty:y,x:(x+.5)*T,y:(y+.5)*T})}

  }

  if(variant%3===0){dot(1,9,1,3,'#6a8a57');dot(2,8,1,2,'#86a169');dot(12,12,2,1,'#527451')}
 }else{

function introRoad(sh,truck=false){
 // Oil-dark avenue, faded crossing and neon spill on wet stone. Always top-down.

 }
 px(roadL-2,0,roadR-roadL+4,sh,'#111f2c');px(roadL+1,0,3,sh,'#3e4e59');px(roadR-5,0,3,sh,'#3e4e59');
 for(let yy=0;yy<sh;yy+=43){

 }
 for(let xx=roadL+7;xx<roadR-5;xx+=17){px(xx,crossY-20,10,44,'#aeb4ac');px(xx+1,crossY-18,8,39,'#d5d2c1');px(xx+5,crossY+8,3,2,'#f2d6ab')}
 // Roadside shop, small but illuminated enough to motivate crossing.

 px(shopL+2,sh*.21,W-shopL-5,sh*.19,'#a88c6c');

 px(shopL-3,sh*.18,W-shopL+2,6,'#eebc79');
 for(let i=0;i<3;i++)px(shopL+5+i*13,sh*.35,9,3,'#ffe3a2');
 drawLight(shopL+14,sh*.34,52,249,188,99,.44);
 // Traffic signal (walk), street signs and puddle reflections.
 px(roadL-15,crossY-37,9,24,'#26323c');px(roadL-14,crossY-32,7,6,'#8ecfa0');
 px(roadL-3,crossY-29,2,57,'#7b8c92');

  if(step>.94)px(0,0,W,sh,`rgba(249,246,224,${Math.min(.85,(step-.94)*11)})`);
 }
 introRain(sh,73);
 const dark=ctx.createLinearGradient(0,0,0,sh);dark.addColorStop(0,'rgba(8,17,36,.31)');dark.addColorStop(.5,'rgba(7,13,24,.02)');dark.addColorStop(1,'rgba(14,23,43,.29)');ctx.fillStyle=dark;ctx.fillRect(0,0,W,sh);
}
function introGoddess(sh){

 for(let i=0;i<90;i++){let a=i*2.399,Ri=(.15+Math.sqrt(rnd(i,77))*.7)*(R-10);let xx=cx+Math.cos(a)*Ri,yy=cy+Math.sin(a)*Ri;px(xx,yy,i%3?2:3,1,i%3?'#aec4bc':'#f5e7ce')}
 for(let rr=R-11;rr>17;rr-=29)for(let i=0;i<48;i++){

 }
 // Colored stained-glass style light passes over the dais.

 for(let i=0;i<28;i++){let xx=rnd(i,35)*W,yy=rnd(i*9,8)*sh,alpha=.27+Math.sin(state.t*1.6+i)*.15;px(xx,yy,2,3,`rgba(255,243,207,${alpha})`)}
 const compact=sh<220,scale=compact?1.6:2;

 introPerson('hero',cx-Math.min(40,W*.18),heroFeet,scale);

 const v=ctx.createRadialGradient(cx,cy,R*.25,cx,cy,Math.max(W,sh)*.64);v.addColorStop(0,'rgba(12,23,42,0)');v.addColorStop(1,'rgba(6,15,32,.67)');ctx.fillStyle=v;ctx.fillRect(0,0,W,sh);
}

function introBlack(sh){
 px(0,0,W,H,'#090e1b');
 if(state.introAge<.6)px(0,0,W,H,`rgba(255,250,231,${.9*(1-state.introAge/.6)})`);

function introTextWrap(text,x,y,maxWidth,lineH=13,size=10,color='#f4eddf'){
 ctx.font=`bold ${size}px monospace`;
 let line='',lines=[];
 for(const word of text.split(' ')){let attempt=line?line+' '+word:word;
  if(line&&ctx.measureText(attempt).width>maxWidth){lines.push(line);line=word}else line=attempt;
 }
 if(line)lines.push(line);
 for(const ln of lines){btxt(ln,x,y,size,color);y+=lineH}
 return y;
}
function drawIntro(){
 const page=introChapters[state.introPage],land=W>H;
 const ph=land?106:Math.min(155,Math.round(H*.31));const sh=H-ph;
 switch(page.stage){
  case'title':introSceneTitle(sh);break;
  case'office':introOffice(sh,Boolean(page.phone));break;
  case'city':introRoad(sh,false);break;
  case'truck':introRoad(sh,true);break;
  case'dark':introBlack(sh);break;
  case'goddess':introGoddess(sh);break;
  default:introForest(sh);
 }
 // Small caption panel, no permanent HUD or separate cutscene interface.
 px(0,sh-5,W,5,'#1b3449');px(0,sh,W,ph,'#0b1d2bed');px(0,sh,W,2,'#83b7af');
 if(page.tag)btxt(page.tag,12,sh+15,9,'#b8e8d3');
 let y=sh+(page.tag?29:25),sz=10,lH=land?14:13;
 for(const line of page.lines){
  const named=Boolean(line.speaker),x=named?land?94:69:13;
  if(named)btxt(line.speaker,12,y,land?10:9,line.speaker==='GODDESS'?'#f6d794':line.speaker==='YOU'?'#a8f2e0':'#9cceeb');
  y=introTextWrap(line.text,x,y,W-x-13,lH,sz,named?'#f3ead8':'#d7e6dd')+4;
 }
 if(page.stage==='title'&&page.lines.length===1){/* Title art above carries the opening. */}
 btxt(state.introPage===introChapters.length-1?'TAP TO EXPLORE':state.introPage===0?'TAP TO BEGIN':'TAP TO CONTINUE',W/2,H-7,8,'#d9b878','center');
 btxt('SKIP >>',W-11,29,9,'#f4e5bb','right');
 if(state.introAge<.22&&page.stage!=='dark')px(0,0,W,sh,`rgba(10,23,36,${(.22-state.introAge)/.22*.3})`);
}

function frame(now){let dt=Math.min(.045,Math.max(0,(now-last)/1000));last=now;update(dt);refreshAction();if(state.scene==='intro')drawIntro();else drawGame();requestAnimationFrame(frame)}
// Small, read-only-oriented QA access; game logic is otherwise entirely self-contained.
window.__rpg={state,introChapters,advanceIntro,debugWarp(tx,ty){state.hero.x=(tx+.5)*T;state.hero.y=(ty+.5)*T},debugSpawnEnemy(){const h=state.hero;state.enemies.push({x:h.x+22,y:h.y,hx:h.x+22,hy:h.y,kind:'slime',hp:2,maxHp:2,speed:0,ang:0,phase:0,hurt:0,dead:0})}};
hud();let resumed=false;try{if(localStorage.getItem('pixel_isekai_v2'))resumed=loadGame()}catch(_){}if(!resumed)startIntro();else document.body.classList.remove('cinematic');state.toast='';state.toastTimer=0;requestAnimationFrame(frame);
})();
